name: Compilar APK de Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 2.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: npm ci
      - name: Generar íconos
        run: npm run iconos
      - name: Pruebas
        run: npm test
      - name: Compilar la app web
        run: npm run build
      - name: Copiar la app web al proyecto Android
        run: npx cap sync android

      - name: Preparar la clave de firma (desde los secretos del repositorio)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "Falta el secreto ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/firma.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/firma.p12" >> "$GITHUB_ENV"

      - name: Compilar APK firmado
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Finanzas.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$RUNNER_TEMP/Finanzas.apk" | head -3 || true

      - name: Borrar la clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/firma.p12"

      - uses: actions/upload-artifact@v4
        with:
          name: Finanzas-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/Finanzas.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "$RUNNER_TEMP/Finanzas.apk" \
            --title "Finanzas $VERSION_NAME" \
            --notes "APK para Android. Descárgalo desde el teléfono, ábrelo y permite instalar apps de esta fuente. Las actualizaciones se instalan encima sin perder tus datos." \
            --latest
